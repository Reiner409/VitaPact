name: Mobile

# The Android and iOS builds of the Tauri shell (RF-29). They run on main and mobile, by hand,
# from the release workflow, and on pull requests that touch the shell, so the desktop checks
# stay fast. Signing material lives in repository secrets only. Without it Android still builds
# an installable APK, and iOS builds an unsigned IPA that people sideload with their own Apple ID
# (AltStore, Sideloadly). With the Apple secrets iOS builds a signed IPA and sends it to
# TestFlight.
on:
  push:
    branches: [main, mobile]
  workflow_dispatch:
  # The release workflow reuses this job to put the APK in the release.
  workflow_call:
    secrets:
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      APPLE_DEVELOPMENT_TEAM:
        required: false
      IOS_CERTIFICATE:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_MOBILE_PROVISION:
        required: false
      APP_STORE_CONNECT_KEY:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
  pull_request:
    paths:
      - .github/workflows/mobile.yml
      - src-tauri/**

permissions:
  contents: read

# Called from Release, github.workflow is "Release", so a push to main never cancels a release.
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
      BUILD_TOOLS: 34.0.0
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK and build tools
        # The runner already ships the Android SDK; only the pieces Tauri needs are added.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "build-tools;$BUILD_TOOLS" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        # The generated MainActivity is swapped for ours, which keeps the app clear of the
        # system bars; it keeps the generated package line.
        run: |
          set -euo pipefail
          pnpm tauri android init --ci
          main=$(find src-tauri/gen/android -name MainActivity.kt | head -n 1)
          echo "Generated $main:" && cat "$main"
          { grep -m 1 '^package ' "$main"; tail -n +2 src-tauri/android/MainActivity.kt; } > main.kt
          mv main.kt "$main"
      - name: Build the release APK (phones and emulators)
        run: pnpm tauri android build --apk --target aarch64 --target armv7 --target x86_64
      - name: Sign the APK
        # With the ANDROID_KEYSTORE secret every build carries the same signature, so a new APK
        # installs over the old one. Without it a throwaway key is made: uninstall before updating.
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          unsigned=$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -n 1)
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 --decode > release.jks
            password="$ANDROID_KEYSTORE_PASSWORD"
          else
            password=throwaway
            keytool -genkeypair -keystore release.jks -storepass "$password" -keypass "$password" \
              -alias vitapact -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=VitaPact"
          fi
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-pass "pass:$password" \
            --out vitapact.apk aligned.apk
          "$tools/apksigner" verify vitapact.apk
      - uses: actions/upload-artifact@v6
        with:
          name: vitapact-android-${{ github.sha }}
          path: vitapact.apk
          if-no-files-found: error

  ios:
    name: iOS app
    runs-on: macos-latest
    env:
      # Read by the Tauri CLI to sign with the distribution certificate and profile.
      TEAM_SECRET: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Apple team
        # Tauri refuses an empty team. The unsigned build never signs, so a placeholder will do.
        run: echo "APPLE_DEVELOPMENT_TEAM=${TEAM_SECRET:-UNSIGNED00}" >> "$GITHUB_ENV"
      - name: Generate the Xcode project
        run: pnpm tauri ios init --ci
      - name: Signed build
        if: env.IOS_CERTIFICATE != '' && env.IOS_MOBILE_PROVISION != '' && env.TEAM_SECRET != ''
        run: |
          set -euo pipefail
          pnpm tauri ios build --export-method app-store-connect
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)
          cp "$ipa" vitapact.ipa
      - name: Upload to TestFlight
        if: env.IOS_CERTIFICATE != '' && env.APP_STORE_CONNECT_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          xcrun altool --upload-app --type ios --file vitapact.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Unsigned build for sideloading
        # Without an Apple certificate the app is built for iPhones but left unsigned; AltStore or
        # Sideloadly sign it with the user's own Apple ID on install. Xcode's "Build Rust Code"
        # phase needs a running `tauri ios build`, so the Rust library is built here and that
        # phase is skipped.
        if: env.IOS_CERTIFICATE == ''
        run: |
          set -euo pipefail
          pnpm web:build
          cargo build --manifest-path src-tauri/Cargo.toml --release --lib \
            --target aarch64-apple-ios --features tauri/custom-protocol
          mkdir -p src-tauri/gen/apple/Externals/arm64/release
          cp src-tauri/target/aarch64-apple-ios/release/libvitapact_lib.a \
            src-tauri/gen/apple/Externals/arm64/release/libapp.a
          project=$(find src-tauri/gen/apple -maxdepth 1 -name '*.xcodeproj' | head -n 1)
          perl -0pi -e 's/shellScript = "(?:[^"\\]|\\.)*xcode-script(?:[^"\\]|\\.)*";/shellScript = "true";/g' \
            "$project/project.pbxproj"
          grep -q 'shellScript = "true"' "$project/project.pbxproj"
          scheme=$(xcodebuild -list -json -project "$project" | jq -r '.project.schemes[] | select(endswith("_iOS"))')
          xcodebuild -project "$project" -scheme "$scheme" -configuration release \
            -sdk iphoneos -arch arm64 -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
          app=$(find build/ios/Build/Products -maxdepth 2 -name '*.app' | head -n 1)
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry vitapact.ipa Payload
      - uses: actions/upload-artifact@v6
        with:
          name: vitapact-ios-${{ github.sha }}
          path: vitapact.ipa
          if-no-files-found: error
