name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types, lint, format, unit tests, i18n keys, traceability matrix
        run: pnpm verify
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: End-to-end tests (network guard on, RNF-01)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build-windows:
    name: Windows installer and portable
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build NSIS installer and executable
        run: pnpm tauri build
      - name: Installer under 15 MB (RNF-09)
        run: pnpm check:installer-size src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: vitapact-setup-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vitapact-portable-${{ github.sha }}
          path: src-tauri/target/release/vitapact.exe
          if-no-files-found: error
