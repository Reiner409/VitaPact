name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Lint and package boundaries
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Unit and component tests
        run: pnpm test
      - name: Translation keys (RNF-12)
        run: pnpm check:i18n
      - name: Traceability matrix (RNF-14)
        run: pnpm check:matrix
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (network guard on, RNF-01)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build-windows:
    name: Windows installer and portable
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build NSIS installer and executable
        run: pnpm tauri build
      - name: Installer under 15 MB (RNF-09)
        run: pnpm check:installer-size src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v5
        with:
          name: vitapact-setup-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: vitapact-portable-${{ github.sha }}
          path: src-tauri/target/release/vitapact.exe
          if-no-files-found: error
