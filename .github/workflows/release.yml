name: Release

# A tag such as v0.1.0 builds the Windows installer and portable and publishes them as a
# GitHub release (F4-03). The tag must match the version in src-tauri/tauri.conf.json.
# Run by hand from main, the workflow makes the tag of the current version itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Version and tag
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, app $version"; exit 1; }
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build NSIS installer and executable
        run: pnpm tauri build
      - name: Installer under 15 MB (RNF-09)
        run: pnpm check:installer-size src-tauri/target/release/bundle
      - name: Name the portable after the version
        shell: bash
        run: cp src-tauri/target/release/vitapact.exe "VitaPact_${VERSION}_x64-portable.exe"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: VitaPact ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            VitaPact_*_x64-portable.exe
