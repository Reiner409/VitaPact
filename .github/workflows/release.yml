name: Release

# A tag such as v1.0.0 builds the Windows installer and portable (F4-03), the Android APK
# (F4-04) and the iOS IPA, and publishes the four files as one GitHub release only when every
# build passed. The tag must match the version in src-tauri/tauri.conf.json. Run by hand from
# main, the workflow makes the tag of the current version itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile release
    uses: ./.github/workflows/mobile.yml
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

  windows:
    name: Windows release
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Version and tag
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, app $version"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build NSIS installer and executable
        run: pnpm tauri build
      - name: Installer under 15 MB (RNF-09)
        run: pnpm check:installer-size src-tauri/target/release/bundle
      - name: Name the portable after the version
        shell: bash
        run: cp src-tauri/target/release/vitapact.exe "VitaPact_${VERSION}_x64-portable.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: vitapact-windows-release
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            VitaPact_*_x64-portable.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [windows, mobile]
    runs-on: ubuntu-latest
    # Only the job that publishes writes to the repository.
    permissions:
      contents: write
    env:
      TAG: ${{ needs.windows.outputs.tag }}
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Release notes from the changelog
        # The section of this version, from its heading to the next one.
        run: |
          awk -v v="## $VERSION " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
      - uses: actions/download-artifact@v6
        with:
          name: vitapact-windows-release
          path: release
      - uses: actions/download-artifact@v6
        with:
          name: vitapact-android-${{ github.sha }}
          path: android
      - uses: actions/download-artifact@v6
        with:
          name: vitapact-ios-${{ github.sha }}
          path: ios
      - name: Name the mobile apps after the version
        run: |
          mv android/vitapact.apk "release/VitaPact_${VERSION}_android.apk"
          mv ios/vitapact.ipa "release/VitaPact_${VERSION}_ios.ipa"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: VitaPact ${{ env.TAG }}
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/**/*
