name: Release

# A tag such as v0.2.0 builds the Windows installer and portable (F4-03) and the Android APK
# (F4-04), and publishes the three files as one GitHub release only when every build passed.
# The tag must match the version in src-tauri/tauri.conf.json. Run by hand from main, the
# workflow makes the tag of the current version itself. iOS is left out until there is an Apple
# licence.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android release
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  windows:
    name: Windows release
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Version and tag
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, app $version"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build NSIS installer and executable
        run: pnpm tauri build
      - name: Installer under 15 MB (RNF-09)
        run: pnpm check:installer-size src-tauri/target/release/bundle
      - name: Name the portable after the version
        shell: bash
        run: cp src-tauri/target/release/vitapact.exe "VitaPact_${VERSION}_x64-portable.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: vitapact-windows-release
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            VitaPact_*_x64-portable.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [windows, android]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.windows.outputs.tag }}
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: vitapact-windows-release
          path: release
      - uses: actions/download-artifact@v6
        with:
          name: vitapact-android-${{ github.sha }}
          path: android
      - name: Name the APK after the version
        run: mv android/vitapact.apk "release/VitaPact_${VERSION}_android.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: VitaPact ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/**/*
